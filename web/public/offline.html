<!doctype html>
<html lang="my">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060a13" />
    <title>Burmanlabs</title>
    <style>
      @font-face {
        font-family: "Noto Sans Myanmar";
        font-weight: 400;
        src: url(/fonts/noto-myanmar-400.woff2) format("woff2");
        unicode-range: U+1000-109F, U+200C-200D, U+25CC, U+A92E, U+A9E0-A9FE, U+AA60-AA7F;
      }
      @font-face {
        font-family: "Noto Sans Myanmar";
        font-weight: 700;
        src: url(/fonts/noto-myanmar-700.woff2) format("woff2");
        unicode-range: U+1000-109F, U+200C-200D, U+25CC, U+A92E, U+A9E0-A9FE, U+AA60-AA7F;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #060a13;
        color: #eef3fb;
        font-family: "Noto Sans Myanmar", system-ui, sans-serif;
        line-height: 1.85;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.6rem; margin: 0 0 4px; line-height: 1.6; }
      p { margin: 0 0 8px; color: #a6b4d0; }
      a {
        display: inline-block; margin-top: 16px; padding: 10px 22px; border-radius: 12px;
        background: #ffb347; color: #060a13; font-weight: 700; text-decoration: none;
      }
      hr { border: 0; border-top: 1px solid #222f4c; margin: 24px auto; width: 120px; }
    </style>
  </head>
  <body>
    <main>
      <h1>အင်တာနက် မရှိပါ</h1>
      <p>ယခင်က ဖွင့်ဖူးသော စာမျက်နှာများကို ဆက်ဖွင့်နိုင်ပါသည်။</p>
      <hr />
      <h1 lang="en">You are offline</h1>
      <p lang="en">Pages you opened before are still available.</p>
      <a href="/my">ပင်မစာမျက်နှာ</a> <a href="/en" lang="en">Home</a>
    </main>
  </body>
</html>
